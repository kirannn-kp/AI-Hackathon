[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mission-route-resolve"
version = "0.1.0"
description = "Synthetic Route & Resolve MicroHack starter and mock operational tools"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
cloud = [
  "agent-framework-core==1.14.0",
  "agent-framework-foundry==1.11.0",
  "agent-framework-orchestrations==1.1.0",
  "azure-identity>=1.19,<2",
  "python-dotenv>=1,<2",
]
authoring = ["Markdown>=3.7,<4"]

[tool.setuptools.packages.find]
where = ["starter"]
